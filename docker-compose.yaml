# Local development setup: a single container running Airflow in "standalone" mode
# (scheduler + web UI + SQLite metadata DB). Not meant for production.
#
#   docker compose up --build        # then open http://localhost:8080
#   docker compose down              # stop and remove the container
services:
  airflow:
    build: .
    command: airflow standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # no login screen; local use only
    volumes:
      # The whole project is mounted, so the DAG sees inbox/, writes tdic_data.db,
      # staging/ and the Excel report back to your folder, and edits show up live.
      - .:/opt/airflow/project
